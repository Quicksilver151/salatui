[package]
name = "salatui"
version = "0.2.1"
edition = "2024"
description = "A terminal UI for Islamic prayer times (calculation + built-in Maldives dataset)"
license = "Apache-2.0"
repository = "https://github.com/Quicksilver151/salatui"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
strip = true
lto = true

[dependencies]
chrono = "0.4.26"
clap = { version = "4.2.1", features = ["derive"] }
confy = "0.5.1"
crossterm = "0.26.1"
directories = "5.0.1"
notify-rust = "4.9.0"
salah = "0.7.5"
serde = { version = "1.0.159", features = ["derive"] }
serde_json = "1.0.104"
time = "0.3.28"
tui = { package = "ratatui", version = "0.28.1", features = ["serde", "widget-calendar"] }
